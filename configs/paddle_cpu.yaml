# Adapted from PaddleX release/3.3 table_recognition.yaml, Apache-2.0.
# Traditional PP-OCR + SLANet_plus; cropped table input, CPU only.
pipeline_name: table_recognition
use_doc_preprocessor: false
use_layout_detection: false
use_ocr_model: true
SubModules:
  TableStructureRecognition:
    module_name: table_structure_recognition
    model_name: SLANet_plus
    model_dir: models/paddle-cpu/SLANet_plus
SubPipelines:
  GeneralOCR:
    pipeline_name: OCR
    text_type: general
    use_doc_preprocessor: false
    use_textline_orientation: false
    SubModules:
      TextDetection:
        module_name: text_detection
        model_name: PP-OCRv4_mobile_det
        model_dir: models/paddle-cpu/PP-OCRv4_mobile_det
        limit_side_len: 960
        limit_type: max
        max_side_limit: 4000
        thresh: 0.3
        box_thresh: 0.6
        unclip_ratio: 1.5
      TextRecognition:
        module_name: text_recognition
        model_name: PP-OCRv4_mobile_rec
        model_dir: models/paddle-cpu/PP-OCRv4_mobile_rec
        batch_size: 8
        score_thresh: 0
